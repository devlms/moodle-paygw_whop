name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Moodle's own checks and test runners on every supported Moodle and PHP pairing.
  moodle:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', database: pgsql }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', database: mariadb }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', database: mariadb }
          - { moodle-branch: MOODLE_501_STABLE, php: '8.4', database: pgsql }
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', database: mariadb }
          - { moodle-branch: MOODLE_503_STABLE, php: '8.4', database: pgsql, coverage: true }

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() && !matrix.coverage }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: PHPUnit tests with coverage
        if: ${{ !cancelled() && matrix.coverage }}
        run: |
          plugindir=$(find moodle -maxdepth 4 -type d -path '*/payment/gateway/whop' | head -1)
          # Moodle 5.1+ keeps web files, this script included, under public/.
          php "$(find moodle -maxdepth 6 -path '*/admin/tool/phpunit/cli/util.php' | head -1)" --buildcomponentconfigs
          cd moodle
          # pcov guesses the folder to watch and picks lib/ in a Moodle root, so point it at the plugin.
          php -d pcov.enabled=1 -d pcov.directory="$GITHUB_WORKSPACE/$plugindir" vendor/bin/phpunit -c "../$plugindir" --fail-on-warning \
            --coverage-html "$GITHUB_WORKSPACE/reports/php-coverage" \
            --coverage-clover "$GITHUB_WORKSPACE/reports/php-coverage/clover.xml" \
            --log-junit "$GITHUB_WORKSPACE/reports/php-coverage/junit.xml"

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload PHP coverage
        if: ${{ !cancelled() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: reports

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  # Publishes the coverage report and badge data to GitHub Pages from main.
  reports:
    name: Publish reports
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    needs: [moodle]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: site
          merge-multiple: true
          pattern: 'php-coverage'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build badges and index
        run: node .github/scripts/report.mjs site
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          PLUGIN: paygw_whop
          REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
